# cargo-deny configuration.
#
# Gates every PR (via .github/workflows/ci.yml -> cargo deny check) for known
# vulnerabilities (advisories), unapproved licenses (licenses), and duplicated
# crates (bans). A Dependabot bump that introduces a CVE, a license we do not
# ship under, or a duplicate dependency will fail CI before merge.
#
# Docs: https://embarkstudios.github.io/cargo-deny/

# advisories: block known CVEs / unsound / yanked crates against the resolved
# graph. The RustSec advisory DB is fetched at check time.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny >=0.16 (PR #611): `vulnerability` is now ALWAYS denied (key
# removed) and `notice` was removed entirely. The remaining fields keep their
# enums: `unmaintained`/`unsound` are scopes (where to check), `yanked` a
# severity. A vulnerability or yanked/unsound crate is a hard release gate.
# Unmaintained crates are only an error when reached from a workspace member;
# transitive unmaintained deps that nothing actually calls stay out of scope.
unmaintained = "workspace"
# Unsound crates can trigger UB; never ship one. Scope "all" flags unsoundness
# anywhere in the graph (the finding is always an error within scope).
unsound = "all"
# A yanked crate means the publisher retracted the release; never ship one.
yanked = "deny"
# Per-advisory opt-outs. An entry is only valid while the vulnerable crate
# version is reachable in this checked graph: a stale entry silently suppresses
# a real finding later and warns `advisory-not-detected` today. Revisit on each
# gpui bump.
#
# Intentionally empty. RUSTSEC-2026-0183 / RUSTSEC-2026-0184 (unsound git2
# Remote::list() and BlameHunk::blame_buffer paths, patched in git2 >= 0.21.0)
# match nothing here: git2 0.20.4 stays in Cargo.lock only through gpui_util's
# [dev-dependencies] and its optional `test-support` dependency, which gpui
# enables from its own [dev-dependencies]. The checked graph (CI's
# cargo-deny-action and scripts/quality/local-gates.sh both run the default
# `cargo deny check`) excludes dev-dependencies: `cargo deny list` contains no
# git2 and `cargo tree -e normal,build --all-features -i git2` prints nothing.
# If a future gpui bump promotes git2 to a production dependency, let the gate
# fail on < 0.21.0 and fix it with a gpui/git2 bump, not a re-added ignore.
ignore = []

# licenses: reject any license expression not explicitly approved below. The
# allow-list starts permissive (OSI-approved, royalty-free) and is tightened as
# the workspace grows.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "NCSA",
    # ksni (Linux tray icon): public-domain-equivalent permissive license.
    "Unlicense",
]
# cargo-deny >=0.16 (PR #611): `unlicensed` and `copyleft` severities were
# removed — a crate whose license is not in `allow` (including unparseable or
# copyleft expressions) is now a hard deny. Keep the allow list permissive and
# add concrete licenses as the workspace grows.
# Crates whose license expression cargo-deny cannot parse with high confidence
# are flagged rather than silently accepted.
confidence-threshold = 0.8
# Ignore workspace members themselves when evaluating licenses; only gate deps.
private = { ignore = true }

# bans: surface duplicate crate versions and wildcard deps. Denying duplicates
# outright is too strict for a workspace this size (transitive duplicates are
# common and usually benign), so duplicates report at `warn` without failing
# the gate.
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
