[package]
name = "taskmanager-history-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Opt-in persistent telemetry history (JSONL, serde-only) for TaskForest"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taskmanager-core = { path = "../taskmanager-core" }

[lib]
name = "taskmanager_history_store"
path = "src/lib.rs"
