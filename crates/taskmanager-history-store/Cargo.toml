[package]
name = "taskmanager-history-store"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Opt-in persistent telemetry history (JSONL, serde-only) for TaskForest"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskmanager-history-store"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taskforest-core = { path = "../taskforest-core", version = "0.5.1" }

[lib]
name = "taskmanager_history_store"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
