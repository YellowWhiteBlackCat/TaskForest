<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="TaskForest forest monitor">
  <defs>
    <linearGradient id="tile" x1="20" y1="4" x2="104" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#176b53"/>
      <stop offset="1" stop-color="#083b32"/>
    </linearGradient>
    <linearGradient id="pine" x1="54" y1="42" x2="76" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7f5ad"/>
      <stop offset="1" stop-color="#96d875"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <!-- The display, forest and stand remain separate silhouettes at small sizes. -->
  <rect x="22" y="28" width="84" height="66" rx="10" fill="#082e28" stroke="#f0f7ed" stroke-width="7"/>
  <path d="M64 95v11M48 107h32" fill="none" stroke="#f0f7ed" stroke-width="7" stroke-linecap="round"/>
  <!-- Two telemetry bars flank one bold pine; no miniature dashboard details. -->
  <rect x="34" y="65" width="9" height="18" rx="2" fill="#72b9a0"/>
  <rect x="85" y="55" width="9" height="28" rx="2" fill="#b7dfa4"/>
  <path d="m64 40 15 21h-8l12 16H68v7h-8v-7H45l12-16h-8z" fill="url(#pine)"/>
</svg>
