[package]
name = "taskmanager-application"
version = "0.4.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Toolkit-neutral commands, reducers, and ports for TaskForest"

[dependencies]
atomicwrites = "0.4.4"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract" }

[dev-dependencies]
taskmanager-test-support = { path = "../taskmanager-test-support" }

[lib]
name = "taskmanager_application"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
