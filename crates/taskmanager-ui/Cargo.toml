[package]
name = "taskmanager-ui"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Owned GPUI component layer: primitives, inputs, and overlays (ADR-017)"
readme = "README.md"
publish = false

[features]
default = []
test-support = []

[dependencies]
# gpui + theme + icons + ui-contract only (ADR-017 §1 dependency direction): no
# gpui-component, no taskmanager-core/application. Colors come exclusively from
# taskmanager-theme's Palette; icon semantics from taskmanager-icons; focus/
# overlay contracts from taskmanager-ui-contract. This crate owns the GPUI
# theme binding (`theme_binding`, ADR-051): the token→gpui conversions and
# window/appearance/font/animation helpers live here, not in the neutral
# theme crate.
gpui = { workspace = true }
taskmanager-theme = { path = "../taskmanager-theme" }
taskmanager-assets = { path = "../taskmanager-assets" }
taskmanager-icons = { path = "../taskmanager-icons" }
taskmanager-ui-contract = { path = "../taskmanager-ui-contract" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lib]
name = "taskmanager_ui"
path = "src/lib.rs"

[[test]]
name = "selectable-text"
path = "tests/gui/selectable_text.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
