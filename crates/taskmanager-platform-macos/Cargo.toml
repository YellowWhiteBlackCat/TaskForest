[package]
name = "taskmanager-platform-macos"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "macOS application-port adapter composition for TaskForest"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskmanager-platform-macos"

# Safety policy (2026-08-02, ADR-019): every provider is implemented ONLY
# through safe, published wrapper crates (sysinfo / open / plist)
# and bounded `std::process::Command` shell-outs to macOS system tools
# (launchctl / smartctl / defaults / system_profiler / who / log / renice) —
# the same pattern the Linux adapter uses for systemctl. No hand-written FFI
# module is allowed (#![forbid(unsafe_code)]).
[features]
# The standard artifact contract: every provider registered here is part of
# the default build; hardware backends are runtime-selected, never a
# user-picked product SKU.
default = ["hardware-all"]
hardware-all = []
# Dev/test-only seam gate (mirrors taskmanager-platform-linux): never enabled
# in product builds; exists so test-only helpers can use
# `#[cfg(any(test, feature = "test-support"))]` without unexpected-cfg warnings.
test-support = []

[dependencies]
taskmanager-application = { path = "../taskmanager-application", version = "0.5.1" }
taskforest-core = { path = "../taskforest-core", version = "0.5.1" }
taskforest-contract = { path = "../taskforest-contract", version = "0.5.1" }
taskmanager-platform-portable = { path = "../taskmanager-platform-portable", version = "0.5.1" }
taskmanager-platform-provider = { path = "../taskmanager-platform-provider", version = "0.5.1" }
taskmanager-platform-runtime = { path = "../taskmanager-platform-runtime", version = "0.5.1" }
# Shared spec -> muda menu bridge (also used by the Windows adapter).
taskmanager-tray-muda = { path = "../taskmanager-tray-muda", version = "0.5.1" }

# Safe cross-platform telemetry (CPU/memory/process/network/disk/components
# behind safe APIs). Reused version with platform-linux/platform-windows.
sysinfo = "0.39"
# Safe URL/open integration (uses the platform shell).
open = "5"
# Safe plist parsing/serialization (LaunchAgents/LaunchDaemons + diskutil).
plist = "1.10"
# JSON parsing for `system_profiler -json` / `smartctl -j` output.
serde_json = "1.0"

# Safe native macOS tray icon + context menu (NSStatusItem behind a safe
# public API; ADR-0NN). Keep upstream default features off: macOS does not
# need tray-icon's Linux GTK/libappindicator path.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
# Main-thread detection for the tray spawn guard: `muda`/`tray-icon` assert the
# application main thread, and `objc2::MainThreadMarker::new()` is the safe
# check that turns a wrong-thread spawn into a typed `TrayFailure::WrongThread`
# instead of a panic. Same `objc2` line the tray stack already resolves.
objc2 = { version = "0.6", default-features = false, features = ["std"] }

[dev-dependencies]
taskmanager-platform-conformance = { path = "../taskmanager-platform-conformance" }

[lib]
name = "taskmanager_platform_macos"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
