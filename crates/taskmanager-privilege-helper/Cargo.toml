[package]
name = "taskmanager-privilege-helper"
version = "0.4.1"
edition = "2024"
rust-version = "1.99.0"
authors = ["TaskForest"]
license = "Apache-2.0"
description = "Fixed-operation privileged helper binaries for TaskForest (TaskForest permission-model Boundary 2, ADR-023)."
publish = false

[[bin]]
name = "taskmanager-smart-self-test-helper"
path = "src/smart_self_test_main.rs"

# Each binary target in this package is a separate feature-specific privileged
# operation (ADR-023, docs/PERMISSION_MODEL.md Boundary 2). The GPU PMU binary
# reads only Intel i915/xe counters through taskmanager-perf-ioctl. The SMART
# self-test binary accepts one fixed, generation-bound disk request, rechecks
# persistent identity and exact requested capability, then starts one test.
# Each target has its own installed path and polkit action; neither is a general
# command runner.

[dependencies]
# The audited perf_event_open boundary crate. Its public API (GpuEngineCounter:
# open_enabled / read_counter) is the ONLY way this helper touches the perf
# syscall — it never writes its own unsafe. This is a permitted second consumer
# of the trust root alongside taskmanager-platform-linux (see the dependency
# firewall test, which allowlists both).
taskmanager-perf-ioctl = { path = "../taskmanager-perf-ioctl" }
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-platform-portable = { path = "../taskmanager-platform-portable" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
