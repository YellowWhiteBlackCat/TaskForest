[package]
name = "taskmanager-ipc"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "High-performance compact binary IPC protocol and cross-platform transport for TaskForest Daemon"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
keywords = ["ipc", "daemon", "protocol", "taskforest", "telemetry"]
categories = ["network-programming", "os"]
include = ["src/**/*", "README.md", "Cargo.toml"]

[dependencies]
taskmanager-core = { path = "../taskmanager-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"
