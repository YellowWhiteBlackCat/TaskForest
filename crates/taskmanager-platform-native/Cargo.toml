[package]
name = "taskmanager-platform-native"
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
description = "Compile-time native OS adapter selection for TaskForest frontends"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskmanager-platform-native"
rust-version = "1.99.1"

[features]
default = ["hardware-all"]
# Each target dependency contributes every hardware provider implemented for
# that OS. Every adapter owns its `hardware-all` registry; an unavailable
# capability stays typed-unavailable instead of being omitted or fabricated.
hardware-all = [
    "taskmanager-platform-linux/hardware-all",
    "taskmanager-platform-macos/hardware-all",
    "taskmanager-platform-windows/hardware-all",
]
# Linux-only isolated fallback coverage. This is not a distribution SKU.
nvidia = ["taskmanager-platform-linux/nvidia"]

[dependencies]
taskforest-core = { path = "../taskforest-core", version = "0.5.1" }
taskforest-contract = { path = "../taskforest-contract", version = "0.5.1" }
taskforest-ipc = { path = "../taskforest-ipc", version = "0.5.1" }

[target.'cfg(target_os = "linux")'.dependencies]
taskmanager-platform-linux = { path = "../taskmanager-platform-linux", version = "0.5.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
taskmanager-platform-macos = { path = "../taskmanager-platform-macos", version = "0.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
taskmanager-platform-windows = { path = "../taskmanager-platform-windows", version = "0.5.1", default-features = false }

[lib]
name = "taskmanager_platform_native"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
