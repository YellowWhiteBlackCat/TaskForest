[package]
name = "taskmanager-platform-native"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Compile-time native OS adapter selection for TaskForest frontends"
rust-version = "1.97.1"

[features]
default = ["hardware-all"]
# Each target dependency contributes every hardware provider implemented for
# that OS. Every adapter owns its `hardware-all` registry; an unavailable
# capability stays typed-unavailable instead of being omitted or fabricated.
hardware-all = [
    "taskmanager-platform-linux/hardware-all",
    "taskmanager-platform-macos/hardware-all",
    "taskmanager-platform-windows/hardware-all",
]
# Linux-only isolated fallback coverage. This is not a distribution SKU.
nvidia = ["taskmanager-platform-linux/nvidia"]

[dependencies]
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract" }

[target.'cfg(target_os = "linux")'.dependencies]
taskmanager-platform-linux = { path = "../taskmanager-platform-linux", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
taskmanager-platform-macos = { path = "../taskmanager-platform-macos", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
taskmanager-platform-windows = { path = "../taskmanager-platform-windows", default-features = false }

[lib]
name = "taskmanager_platform_native"
path = "src/lib.rs"
