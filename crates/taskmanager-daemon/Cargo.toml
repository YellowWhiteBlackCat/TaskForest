[package]
name = "taskmanager-daemon"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Background telemetry collector, persistence owner, and IPC daemon service for TaskForest"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
keywords = ["daemon", "telemetry", "system-monitor", "taskforest", "service"]
categories = ["os", "command-line-utilities"]
include = ["src/**/*", "README.md", "Cargo.toml"]

[dependencies]
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-ipc = { path = "../taskmanager-ipc" }
taskmanager-history-store = { path = "../taskmanager-history-store" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract" }
taskmanager-platform-runtime = { path = "../taskmanager-platform-runtime" }
taskmanager-platform-native = { path = "../taskmanager-platform-native", default-features = false }
pico-args = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ctrlc = { version = "3.5", features = ["termination"] }

[[bin]]
name = "taskforest-daemon"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27"
