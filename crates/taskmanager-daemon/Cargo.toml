[package]
name = "taskmanager-daemon"
version = "0.3.1"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Background telemetry collector, persistence owner, and IPC daemon service for TaskForest"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskmanager-daemon"
keywords = ["daemon", "telemetry", "system-monitor", "taskforest", "service"]
categories = ["os", "command-line-utilities"]
include = ["src/**/*", "tests/**/*", "README.md", "Cargo.toml", "LICENSE"]

[dependencies]
taskmanager-core = { path = "../taskmanager-core", version = "0.3.1" }
taskmanager-ipc = { path = "../taskmanager-ipc", version = "0.3.1" }
taskmanager-history-store = { path = "../taskmanager-history-store", version = "0.3.1" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract", version = "0.3.1" }
taskmanager-platform-runtime = { path = "../taskmanager-platform-runtime", version = "0.3.1" }
taskmanager-platform-native = { path = "../taskmanager-platform-native", version = "0.3.1" }
pico-args = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ctrlc = { version = "3.5", features = ["termination"] }
crossbeam-channel = "0.5"

[features]
default = ["hardware-all"]
hardware-all = ["taskmanager-platform-native/hardware-all"]

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[[bin]]
name = "taskforest-daemon"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27"
