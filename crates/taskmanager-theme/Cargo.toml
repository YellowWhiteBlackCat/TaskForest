[package]
name = "taskmanager-theme"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Toolkit-neutral theme tokens, skin/mode/high-contrast/fonts axes for TaskForest (ADR-017, ADR-026)"
readme = "README.md"
publish = false

# Toolkit-NEUTRAL by default (ADR-026): the design data modules never name a
# toolkit type. The toolkit bindings live in cfg'd modules — `src/gpui.rs`
# behind the optional `gpui` feature, `src/iced.rs` behind the optional
# `iced` feature (CORE-07: the orphan rule pins `From<Color> for …` impls to
# this crate, and the iced frontend previously grew a local second
# conversion point, so its token→value edge is quarantined here too). The
# TUI keeps its lossy terminal color quantization locally (ADR-026) and
# consumes this crate with no toolkit feature at all.

[dependencies]
gpui = { version = "0.2.2", default-features = false, optional = true }
# The thinnest iced surface the binding needs: `iced_core` owns
# Color/Font/font::Weight (the umbrella re-exports them from here), pulls no
# windowing/rendering chain, and feature-unifies with the iced frontend's
# full feature set inside the workspace graph. The types are identical to
# the umbrella's, so the frontend consumes them without a cast.
iced_core = { version = "0.14.0", optional = true }

[features]
gpui = ["dep:gpui"]
iced = ["dep:iced_core"]

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }

[lib]
name = "taskmanager_theme"
path = "src/lib.rs"
