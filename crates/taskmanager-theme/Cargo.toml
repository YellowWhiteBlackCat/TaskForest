[package]
name = "taskmanager-theme"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Toolkit-neutral theme tokens, skin/mode/high-contrast/fonts axes for TaskForest (ADR-017, ADR-026)"
readme = "README.md"
publish = false

# Toolkit-NEUTRAL unconditionally (ADR-026, ADR-051): every module compiles
# zero toolkit code on every target and this dependency table names no
# toolkit at all — the table below IS the neutrality proof. Each frontend
# owns its token→toolkit binding inside its own dependency closure
# (`taskmanager-ui::theme_binding` for GPUI, `taskmanager-iced::theme_binding`
# for iced); the TUI keeps its lossy terminal color quantization locally
# (ADR-026).

[dependencies]

[lib]
name = "taskmanager_theme"
path = "src/lib.rs"
