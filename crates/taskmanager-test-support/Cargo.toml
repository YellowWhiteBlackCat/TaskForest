[package]
name = "taskmanager-test-support"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Dev-only typed behavior-fixture builders for TaskForest tests"

[dependencies]
taskmanager-application = { path = "../taskmanager-application" }
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract" }

[lib]
name = "taskmanager_test_support"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
