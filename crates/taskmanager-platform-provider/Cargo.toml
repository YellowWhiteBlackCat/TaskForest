[package]
name = "taskmanager-platform-provider"
version = "0.4.1"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Platform-neutral native provider SPI for TaskForest capability adapters"

[dependencies]
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract" }

[lib]
name = "taskmanager_platform_provider"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
