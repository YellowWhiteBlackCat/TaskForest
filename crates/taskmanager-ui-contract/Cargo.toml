[package]
name = "taskmanager-ui-contract"
version = "0.4.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Toolkit-neutral semantic UI contracts for TaskForest frontends"

[dependencies]
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-application = { path = "../taskmanager-application" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract" }

[lib]
name = "taskmanager_ui_contract"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
