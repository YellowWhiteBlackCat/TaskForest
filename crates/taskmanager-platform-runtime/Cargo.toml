[package]
name = "taskmanager-platform-runtime"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "OS-neutral bounded capability runtime for TaskForest native adapters"

[dependencies]
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
# The runtime owns one scheduler and its systems are explicitly chained. The
# multi-threaded ECS executor otherwise initializes a full compute pool for a
# handful of short bookkeeping systems; use Bevy's single-threaded executor
# and keep concurrency in the typed provider lanes below.
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
crossbeam-channel = "0.5"
taskmanager-application = { path = "../taskmanager-application" }
taskmanager-core = { path = "../taskmanager-core" }
taskmanager-platform-contract = { path = "../taskmanager-platform-contract" }

[lib]
name = "taskmanager_platform_runtime"
path = "src/lib.rs"
