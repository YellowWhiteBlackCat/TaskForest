[package]
name = "taskforest-ipc"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "High-performance compact binary IPC protocol and cross-platform transport for TaskForest Daemon"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskforest-ipc"
keywords = ["ipc", "daemon", "protocol", "taskforest", "telemetry"]
categories = ["network-programming", "os"]
include = ["src/**/*", "tests/**/*", "README.md", "Cargo.toml", "LICENSE"]

[dependencies]
taskforest-core = { path = "../taskforest-core", version = "0.5.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5"
thiserror = "2.0"

[dev-dependencies]
taskmanager-test-support = { path = "../taskmanager-test-support" }
tempfile = "3.27"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
