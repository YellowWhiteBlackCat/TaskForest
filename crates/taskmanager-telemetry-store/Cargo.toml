[package]
name = "taskmanager-telemetry-store"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Platform-neutral bounded telemetry history read model for TaskForest"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskmanager-telemetry-store"

[dependencies]
ringbuf = "0.5"
taskforest-core = { path = "../taskforest-core", version = "0.5.1" }

[dev-dependencies]
taskmanager-test-support = { path = "../taskmanager-test-support" }

[lib]
name = "taskmanager_telemetry_store"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
