[package]
name = "taskmanager-icons"
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Toolkit-neutral semantic icon registry for TaskForest (ADR-017, ADR-051)"
readme = "README.md"
publish = false

[dependencies]
# Neutral on every target (ADR-051): path table + embedded bytes only; each
# frontend owns its toolkit rendering adapter in its own crate.
taskmanager-assets = { path = "../taskmanager-assets" }
taskmanager-ui-contract = { path = "../taskmanager-ui-contract" }

[lib]
name = "taskmanager_icons"
path = "src/lib.rs"
