[package]
name = "taskmanager-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Platform-neutral domain models, policies, and shared services for TaskForest"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskmanager-core"
keywords = ["system-monitor", "process-tree", "telemetry", "metrics", "smart"]
categories = ["os", "development-tools::profiling", "data-structures"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "Cargo.toml", "LICENSE"]
autotests = false

[[test]]
name = "headless"
path = "tests/headless.rs"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
# Integration-harness fixtures (tests/headless). Deliberately NOT reachable
# from the lib unit-test mounts: consuming test-support there would link two
# core instances (E0308); shared fixtures require the standalone harness.
taskmanager-test-support = { path = "../taskmanager-test-support" }

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
