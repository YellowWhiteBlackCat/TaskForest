[package]
name = "taskmanager-tray-muda"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Shared muda/tray-icon bridge for the Windows and macOS tray adapters"
publish = false

# Single source for the neutral TrayMenuSpec -> muda menu mapping shared by
# the Windows and macOS adapters (ADR-0NN). The repository rule forbids
# copying a private helper into a second crate; this crate is that one
# implementation. tray-icon is target-gated and its upstream default features
# are disabled, so Linux CI never pulls GTK/libappindicator through this seam.

[dependencies]
taskforest-core = { path = "../taskforest-core" }
taskforest-contract = { path = "../taskforest-contract" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[lib]
name = "taskmanager_tray_muda"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
