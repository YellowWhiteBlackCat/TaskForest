[package]
name = "taskforest-contract"
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Platform-neutral capability, request, event, and port contracts for TaskForest"
readme = "README.md"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
documentation = "https://docs.rs/taskforest-contract"
keywords = ["system-monitor", "contract", "telemetry", "ports", "capabilities"]
categories = ["os", "development-tools::profiling"]
include = ["src/**/*", "tests/**/*", "README.md", "Cargo.toml", "LICENSE"]

[dependencies]
taskforest-core = { path = "../taskforest-core", version = "0.5.1" }

[lib]
name = "taskforest_contract"
path = "src/lib.rs"

# Lint 事实源：根 `Cargo.toml` 的 `[workspace.lints]`（见 ADR-056）。
[lints]
workspace = true
