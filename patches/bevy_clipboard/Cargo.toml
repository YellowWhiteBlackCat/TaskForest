[package]
edition = "2024"
name = "bevy_clipboard"
version = "0.20.0-rc.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Provides clipboard support for Bevy Engine"
homepage = "https://bevyengine.org"
readme = "README.md"
keywords = [
    "bevy",
    "clipboard",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevyengine/bevy"

[package.metadata.docs.rs]
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
]
all-features = true

[features]
default = []
image = [
    "system_clipboard",
    "dep:bevy_asset",
    "dep:bevy_image",
    "dep:wgpu-types",
    "arboard/image-data",
]
system_clipboard = ["dep:arboard", "dep:wl-clipboard-rs"]
wayland = ["arboard?/wayland-data-control"]

[lib]
name = "bevy_clipboard"
path = "src/lib.rs"

[dependencies.bevy_app]
version = "0.20.0-rc.2"
default-features = false

[dependencies.bevy_ecs]
version = "0.20.0-rc.2"
default-features = false

[dependencies.bevy_log]
version = "0.20.0-rc.2"
default-features = false

[dependencies.bevy_platform]
version = "0.20.0-rc.2"
default-features = false

[target.'cfg(any(windows, all(unix, not(target_os = "linux"))))'.dependencies.arboard]
version = "3.6.1"
optional = true
default-features = false

[target."cfg(any(windows, unix))".dependencies.bevy_asset]
version = "0.20.0-rc.2"
optional = true
default-features = false

[target."cfg(any(windows, unix))".dependencies.bevy_image]
version = "0.20.0-rc.2"
optional = true
default-features = false

[target."cfg(any(windows, unix))".dependencies.wgpu-types]
version = "30"
optional = true
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Navigator",
    "Clipboard",
]

[target.'cfg(target_os = "linux")'.dependencies.wl-clipboard-rs]
version = "0.9.3"
optional = true

[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_lifetimes = "allow"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "allow"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(docsrs_dep)"]
