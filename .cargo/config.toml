# sccache is intentionally opt-in, not a default Cargo wrapper.
#
# sccache 0.17 bootstraps its local server through a Unix startup socket under
# TMPDIR. This repository's agent lease uses a deep NVMe scratch path for
# TMPDIR; that path can exceed Linux SUN_LEN before rustc even starts. A
# default wrapper would therefore make basic commands such as `cargo clean`
# fail before Cargo can do any work. Use `RUSTC_WRAPPER=sccache` only when the
# caller has supplied a short, socket-safe TMPDIR; normal Cargo commands use
# plain rustc and remain reliable under the repository lease.
#
# The dev workstation's E-core pinning (rustc on CPU 4-11) is deliberately
# NOT configured here: the machine's user-level ~/.cargo/config.toml applies
# it to every Rust project on that machine, so CI and other machines keep
# plain rustc. See the "Compile affinity" section of AGENTS.md.

# ADR-051: each frontend is its own product crate. Address a product by
# package locally (`-p`) instead of re-selecting features — these aliases are
# the convenience spelling. With four independent toolchains, a workspace-wide
# `cargo build` compiles all of them; scope with --exclude when iterating.
[alias]
gpui = "build -p taskmanager-gpui"
iced = "build -p taskmanager-iced"
tui = "build -p taskmanager-tui"
bevy = "build -p taskmanager-bevy-ui"
gpui-test = "nextest run -p taskmanager-gpui -j 4"
iced-test = "nextest run -p taskmanager-iced -j 4"
tui-test = "nextest run -p taskmanager-tui -j 4"
bevy-test = "nextest run -p taskmanager-bevy-ui -j 4"
cli-test = "nextest run -p taskmanager-cli -j 4"
gates-test = "nextest run -p taskmanager-gates --test logic --test performance -j 4"
