[workspace]
exclude = [
    "crates/taskmanager-afpacket/fuzz",
]
members = [".", "crates/*"]
resolver = "2"

# The root package is `taskmanager-gates` (ADR-051): the cross-crate
# conformance host. It ships no binary and no public API — the four frontend
# products (`taskforest-g`, `taskforest-i`, `taskmanager-tui`, `taskforest-b`)
# live in their own crates under `crates/`, each with its own `[[bin]]` over
# the shared `taskmanager-cli` harness. This package hosts the workspace
# structural gate suites (`tests/logic`, `tests/performance`) and their
# fixtures. The workspace-level `[patch]`, `[profile.*]`, and feature
# unification live here because the workspace root lives here.
[package]
name = "taskmanager-gates"
version = "0.1.0"
edition = "2024"
authors = ["TaskForest contributors"]
description = "Cross-crate conformance gate host for the TaskForest workspace (no binary)"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/YellowWhiteBlackCat/TaskForest"
homepage = "https://github.com/YellowWhiteBlackCat/TaskForest"
publish = false
rust-version = "1.97.1"
# The `tests/gui.rs` suite's product target is declared by
# `taskmanager-gpui` (ADR-051); this host registers only its own suites.
autotests = false

[[test]]
name = "logic"
path = "tests/logic.rs"

[[test]]
name = "performance"
path = "tests/performance.rs"

[dev-dependencies]
# The gate suites compile against real owner types; every workspace fact they
# touch is imported from its owner crate. Product-scoped tests live in the
# product crates (the GPUI GUI interaction suite in `taskmanager-gpui`), not
# here.
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chrono = "0.4"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
taskmanager-core = { path = "crates/taskmanager-core" }
taskmanager-application = { path = "crates/taskmanager-application" }
taskmanager-app-host = { path = "crates/taskmanager-app-host" }
taskmanager-escalation = { path = "crates/taskmanager-escalation" }
taskmanager-telemetry-store = { path = "crates/taskmanager-telemetry-store" }
taskmanager-ui-contract = { path = "crates/taskmanager-ui-contract" }
taskmanager-shell = { path = "crates/taskmanager-shell" }
taskmanager-theme = { path = "crates/taskmanager-theme" }
taskmanager-assets = { path = "crates/taskmanager-assets" }
# Integration tests construct the platform runtime through the composition
# edge (ADR-009 reverse dependency firewall) instead of naming an OS crate,
# so `--test gui` compiles and runs on every supported platform. The shared
# conformance assertions keep the live-smoke contract host-neutral.
taskmanager-platform-native = { path = "crates/taskmanager-platform-native" }
taskmanager-platform-conformance = { path = "crates/taskmanager-platform-conformance" }
taskmanager-test-support = { path = "crates/taskmanager-test-support" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
taskmanager-platform-linux = { path = "crates/taskmanager-platform-linux", default-features = false, features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
proc-macro-error2 = { path = "./patches/proc-macro-error2" }
# Vendored gpui 0.2.2 patch (strict Wayland): upstream declares the
# Linux `xkbcommon` dependency with `features = ["wayland", "x11"]`
# unconditionally, so every binary links `-lxkbcommon-x11` even in a
# wayland-only build. The patch moves `xkbcommon/x11` behind gpui's own `x11`
# feature (enabled only by the dev-only `test-support`), so production links
# zero X11 system libraries.
gpui = { path = "./patches/gpui" }
# Vendored cryoglyph 0.1.0 compatibility patch: its public API is unchanged,
# but its glyph cache uses the fixed lru 0.18.2 panic-safety implementation.
cryoglyph = { path = "./patches/cryoglyph" }
