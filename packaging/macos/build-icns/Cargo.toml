# Standalone tool: regenerate packaging/macos/icon.icns from the
# packaging/macos/icon_*.png ladder using the pure-Rust `icns` crate.
#
# This manifest is intentionally NOT part of the workspace
# (workspace members are "." and "crates/*"), so it is never built by a
# plain `cargo build`/`cargo test` at the repo root. Invoke it explicitly:
#
#   cargo run --manifest-path packaging/macos/build-icns/Cargo.toml
#
# Requires that the PNG ladder already exists (regenerate via
# packaging/macos/regenerate-icons.sh). Pure Rust: runs on Linux/macOS/Windows,
# so the committed icon.icns can be reproduced without iconutil/png2icns.
[package]
name = "build-icns"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
icns = "0.4"
png = "0.17"

# Empty workspace table: this tool is intentionally a standalone root, NOT a
# member of the repo workspace, so `cargo build` / `cargo test` at the repo
# root never compiles it. Invoke explicitly via --manifest-path.
[workspace]
