<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="TaskForest tray monitor">
  <defs>
    <linearGradient id="tray-forest" x1="24" y1="14" x2="104" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08704f"/>
      <stop offset="1" stop-color="#034a38"/>
    </linearGradient>
    <linearGradient id="tray-leaf" x1="72" y1="18" x2="102" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9e56f"/>
      <stop offset="1" stop-color="#79c94d"/>
    </linearGradient>
  </defs>

  <!-- The circle is fully opaque; only the pixels outside it are transparent. -->
  <circle cx="64" cy="64" r="59" fill="url(#tray-forest)"/>

  <!-- Compact, explicitly opaque performance window for 16–22px tray use. -->
  <rect x="24" y="43" width="80" height="62" rx="9" fill="#0b6048" stroke="#f1f8e9" stroke-width="6"/>
  <path d="M27 57h74" fill="none" stroke="#f1f8e9" stroke-width="5"/>
  <g fill="#9bd45b">
    <circle cx="35" cy="50" r="3"/>
    <circle cx="45" cy="50" r="3"/>
    <circle cx="55" cy="50" r="3"/>
    <rect x="73" y="79" width="9" height="17" rx="2"/>
    <rect x="88" y="67" width="9" height="29" rx="2"/>
  </g>
  <path d="M33 81h12l5-13 7 25 7-18 6 6h7" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>

  <!-- A two-leaf sprout carries the forest identity without shrinking the app mark. -->
  <path d="M83 44V31" fill="none" stroke="#dff4c8" stroke-linecap="round" stroke-width="5"/>
  <path d="M82 34c-11 0-18-5-20-15 11-1 18 4 20 15zM85 32c1-11 8-17 19-17 0 11-7 18-19 19z" fill="url(#tray-leaf)"/>
</svg>
