# Workspace-wide structural ratchets. These are deliberately global rather
# than per-file allowlists: new code cannot exceed the largest audited legacy
# function while named-system refactors continue lowering the ceiling.
#
# Lowered from 48/650 after the W27 refactors (windows/macos facet-surface
# assertion batteries, gpui `run_production`) removed every function above 44.
# The 44/500 target is now met: `platform-runtime::channel::construction::build`
# was split into per-facet-domain lane/facet helpers, and
# `gpui::render_page_body` was split into per-page body helpers.
cognitive-complexity-threshold = 44
too-many-lines-threshold = 500
