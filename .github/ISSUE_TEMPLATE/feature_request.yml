name: 功能建议
description: 提出新能力或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与痛点，而不是直接给方案
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 相关平台
      options:
        - 全平台
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: checkboxes
    id: principles
    attributes:
      label: 产品原则核对
      description: TaskForest 默认无特权、数据诚实；如建议需要新权限请说明理由
      options:
        - label: 该建议不需要后台常驻或静默提权
