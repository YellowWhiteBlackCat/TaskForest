# Continuous integration for the Linux-first taskmanager crate.
#
# Quota budget: GitHub free-runner minutes are finite, so CI carries only the
# cheap, deterministic essentials. Everything expensive or environment-bound
# moved local — `scripts/quality/local-gates.sh` reproduces the full former
# gate set on this machine (see docs/QUALITY_GATES.md):
#
#   local standard tier: clippy, workspace nextest, doctests, rustdoc, the
#       per-product fallback builds, the nvidia fallback matrix, cargo deny,
#       the release build, and (--with-gui) the GPUI interaction matrix.
#   local extended tier: llvm-cov with the configured workspace floors plus
#       per-crate floors, mutation testing of the core/application diff,
#       Miri on the three audited unsafe crates, fuzz-target build/runs,
#       release-bloat and bench trends.
#
# Kept in CI on purpose (not a local-only stage):
#   - semver job         the public-API semver gate
#                       (scripts/quality/semver-api-gate.sh): every publishable
#                       crate is compared against the base revision, and a
#                       breaking change blocks the merge. The publishable
#                       crates are not on crates.io yet, so the baseline is a
#                       git revision, not a published version.
#
# Removed from the PR path to save quota:
#   - coverage job      -> local extended (same llvm-cov invocation)
#   - ui-shapes matrix  -> local standard (shape-tui / shape-iced stages)
#   - gpui interaction  -> local standard --with-gui (needs a live session)
#   - macOS             -> .github/workflows/portability.yml (PR/main compile
#       and library tests; packaging and real-device visual validation remain
#       deferred)
#   - Windows           -> .github/workflows/portability.yml (native boundary
#       receipt on every PR/main push; blocking, but kept out of Linux jobs)
#
# Wall-clock budget: the cheap `policy` gate runs first and fails before any
# compile-heavy job spends runner time. Once it passes, `lint`, `test`, `docs`,
# `semver`, and `linux` run in parallel, so successful PR feedback waits for
# the slowest job instead of the sum of every stage. Each job owns its
# rust-cache line. The release-smoke job keeps the job id `linux` because
# rust-cache keys by job id — that id is what lets packaging.yml's `linux`
# release job restore the dependency cache this job warmed on the same commit.
#
# Compile-time budget (env changes here MUST stay aligned with
# portability.yml and packaging.yml: rust-cache hashes every CARGO*/RUST*
# variable, and any divergence silently splits the shared cache lines):
#   - CARGO_PROFILE_DEV_DEBUG=line-tables-only: test binaries keep line
#     numbers for failure backtraces but drop full DWARF, cutting dev/test
#     compile and link time and shrinking every cache line.
#   - RUSTFLAGS carries `-C link-arg=-fuse-ld=mold` (Linux-only): the GPUI
#     closure links large binaries and mold cuts link time. packaging.yml's
#     Linux job carries the byte-identical RUSTFLAGS for the same
#     cache-sharing reason; portability.yml and the Windows packaging jobs
#     must NOT add it (no mold on Windows/macOS runners).
#   - cache-workspace-crates: unchanged workspace members become cache
#     hits, so a PR recompiles only the crates it touched plus dependents.
#   - PR release builds override LTO off / codegen-units 16: the smokes
#     below validate artifact *shape* (package() replay, install modes,
#     polkit exec resolution, rollback), not optimization level. main
#     pushes, dispatches, and tags still build the shipping profile
#     (packaging.yml release artifacts always use the manifest profile).
#
# Toolchain policy: all workflows pin the repository's 1.99.0 toolchain.
# `Cargo.toml::rust-version` remains the compatibility floor and must
# not be used as a stale CI pin.
#
# Architecture context (unchanged):
# - `taskmanager-core` owns platform-neutral contracts and shared services.
# - `taskmanager-application` owns toolkit-neutral commands, reducers, and ports.
# - `taskmanager-platform-linux` exclusively owns `/proc`, `/sys`, command, control,
#   hardware, process, service, startup, session, SMART, sensor, and storage providers.
# - GPUI and Ratatui consume the shared contracts and compose the Linux adapter at
#   their runtime edge. Architecture tests block provider code from returning to core.
#
# Linux is the blocking product gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  CARGO_INCREMENTAL: 0
  # Shared verbatim by portability.yml and packaging.yml so every workflow's
  # rust-cache line hashes the same dev-profile setting.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  SCCACHE_GHA_ENABLED: "true"

# Burst dedupe: when several commits land on one ref back-to-back, only the
# newest verdict matters — superseded in-flight runs cancel instead of
# burning full Linux-gate minutes. Each PR groups by its own ref. Releases
# deliberately keep their own NON-cancelling concurrency (a tag publish must
# never abort mid-flight; see release.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The manual workflow only needs to read repository contents. Keep the default
# token from gaining write access when the release gate is eventually enabled.
permissions:
  contents: read

jobs:
  policy:
    name: Linux (fast policy gates + dependency audit)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: Fetch private shared UI kit dependency
        env:
          SHARED_UI_KIT_READ_KEY: ${{ secrets.SHARED_UI_KIT_READ_KEY }}
        run: bash scripts/quality/shared-ui-git-credentials.sh fetch
      # This is the same cheap fail-fast entry point developers run locally.
      # It completes before GUI packages, Cargo caches, or workspace builds.
      # The release helper binaries do not exist in this policy job yet, so
      # install-manager-smoke is repeated in the later release job after its
      # helper build; it remains a blocking check there.
      - name: Fast local-equivalent gates
        env:
          SKIP_INSTALL_MANAGER_SMOKE: "1"
        run: timeout --kill-after=10s 300s bash scripts/quality/local-gates.sh quick
      # Keep the audit on the runner so it can reuse the private Git dependency
      # fetched above without passing credentials into a Docker action.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Audit dependency policy
        run: cargo deny check

  lint:
    name: Linux (clippy)
    needs: policy
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # GPUI's font-kit backend needs fontconfig development metadata, and
      # GPUI links against xkbcommon on Linux. The runner image does not
      # guarantee either -dev package, so install both explicitly. mold is
      # the link-time accelerator behind workflow-level RUSTFLAGS.
      - name: Install Linux GUI system deps and mold
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libxkbcommon-dev mold
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - name: Fetch private shared UI kit dependency
        env:
          SHARED_UI_KIT_READ_KEY: ${{ secrets.SHARED_UI_KIT_READ_KEY }}
        run: bash scripts/quality/shared-ui-git-credentials.sh fetch
      - uses: taiki-e/install-action@sccache
      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('RUSTC_WRAPPER', 'sccache');
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # `test-support` is DEV-only: gpui's upstream test-support hard-wires
      # X11, so it is enabled for test targets but never for the release build
      # below (strict Wayland product policy).
      #
      # The trailing `-W` flags mirror the local standard gate's clippy stage
      # (scripts/quality/local-gates.sh) and are what activate clippy.toml's
      # workspace structural ratchets: both lints are allow-by-default
      # (restriction / pedantic), so `-D warnings` alone never enables them.
      # Keep this command identical to the local gate.
      - run: cargo clippy --locked --workspace --all-targets --features test-support -- -D warnings -W clippy::cognitive_complexity -W clippy::too_many_lines
      # Production-config companion to the clippy step above: the same helper
      # script the local standard gate runs in this exact order (clippy, then
      # production-config) and the same four product commands, so CI and local
      # stay zero-drift by construction. The clippy step — like every nextest
      # layer — enables `test-support`, so frontend code compiled only when
      # that dev-only feature is OFF had no Linux gate; a warning there (e.g.
      # a binding used solely by a `#[cfg(any(test, feature = "test-support"))]`
      # debug selector, the 2026-09-22 macOS incident) stayed green here and
      # failed the native jobs. This step covers all four product
      # configurations without `test-support`: gpui (bin plus the reduced
      # `--no-default-features` lib), iced, tui, and bevy — bevy had no
      # production-config compile anywhere outside release packaging.
      #
      # The script preserves this job's RUSTFLAGS (mold included), appends
      # `-D warnings` if absent, and defaults `TM_CARGO_LOCK` to `--locked`; no
      # env override is needed, so `PRODUCTION_CONFIG_TIMEOUT` keeps its 900s
      # per-command default. The outer timeout bounds the whole step at 30
      # minutes, so a hang fails the step instead of the 45-minute job budget.
      - run: timeout --kill-after=30s 1800s bash scripts/quality/production-config-check.sh

  test:
    name: Linux (workspace tests + doctests)
    needs: policy
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The all-targets debug build still needs headroom on the free runner.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - name: Install Linux GUI system deps and mold
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libxkbcommon-dev mold
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Fetch private shared UI kit dependency
        env:
          SHARED_UI_KIT_READ_KEY: ${{ secrets.SHARED_UI_KIT_READ_KEY }}
        run: bash scripts/quality/shared-ui-git-credentials.sh fetch
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@sccache
      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('RUSTC_WRAPPER', 'sccache');
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - run: cargo nextest run --locked --workspace --all-targets --features test-support --profile ci -j 4 -E 'not binary(throughput)'
      # Keep an explicit package-filtered product gate in addition to the
      # broad workspace run: all four frontend products must be discovered and
      # pass their own headless suites before this job can merge.
      - name: Four frontend product nextest gate
        run: timeout --kill-after=30s 3600s bash scripts/quality/four-frontends-nextest.sh
      # nextest does not execute doctests on stable Rust.
      - run: cargo test --locked --doc --workspace -j 4
      # The GPUI product advertises --demo; keep its actual composition path
      # covered separately from the broad workspace suite. This default gate
      # is headless and performs no host I/O or visible desktop action.
      - run: timeout --kill-after=10s 1800s bash scripts/accept-gpui-demo.sh --headless

  docs:
    name: Linux (rustdoc)
    needs: policy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI system deps and mold
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libxkbcommon-dev mold
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Fetch private shared UI kit dependency
        env:
          SHARED_UI_KIT_READ_KEY: ${{ secrets.SHARED_UI_KIT_READ_KEY }}
        run: bash scripts/quality/shared-ui-git-credentials.sh fetch
      - uses: taiki-e/install-action@sccache
      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('RUSTC_WRAPPER', 'sccache');
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # Rustdoc must stay warning-free: broken intra-doc links, unresolved
      # symbol references, public docs linking to private items, and unclosed
      # HTML tags in doc comments are all CI failures.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps

  # The public-API semver gate is its own job on purpose.
  #
  # Why not inside an existing job:
  #  - The gate is the heaviest job by construction: it emits rustdoc JSON for
  #    every publishable crate twice (the current tree and the baseline tree),
  #    so folding it into `lint`, `test` or `docs` would silently inflate that
  #    job's budget and make its failure attribution ambiguous (a rustdoc
  #    failure and an API break would share one step).
  #  - It needs a full-history checkout (`fetch-depth: 0`) and a pinned
  #    third-party tool; neither belongs to a job that does something else.
  #  - Quota: as a separate `needs: policy` job it runs in parallel with
  #    `lint`/`test`/`docs`/`linux`, so the PR wall-clock critical path stays
  #    at the slowest existing job (the 60-minute `test` job) instead of
  #    growing. `needs: policy` keeps the fast-fail order: the cheap policy
  #    gate still rejects a bad PR before any compile-heavy job spends
  #    minutes.
  #
  # The `policy` job deliberately does NOT install cargo-semver-checks: the
  # quick-tier `semver-checks` stage of scripts/quality/local-gates.sh skips
  # itself when the tool is absent (that is the tool's documented "not
  # available" exit code), and the real, blocking run happens here.
  semver:
    name: Linux (public API semver gate)
    needs: policy
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline is a git revision, not a crates.io release: the
          # publishable crates are not published yet, so the tool builds the
          # baseline rustdoc from the local history. A shallow clone cannot
          # resolve that revision.
          fetch-depth: 0
      - name: Install Linux GUI system deps and mold
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libxkbcommon-dev mold
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Fetch private shared UI kit dependency
        env:
          SHARED_UI_KIT_READ_KEY: ${{ secrets.SHARED_UI_KIT_READ_KEY }}
        run: bash scripts/quality/shared-ui-git-credentials.sh fetch
      # cargo-semver-checks 0.51.0 is the current stable release. It needs a
      # rustc >= 1.93 (this repository pins 1.99.0) and ships prebuilt Linux
      # binaries, so `fallback: none` keeps the install deterministic instead
      # of silently compiling the tool from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # A pull request is compared against the base branch it targets; a push
      # to main is compared against the commit it replaced. The revision is
      # always an expression, never a hard-coded sha. The checkout already
      # carries the full history (`fetch-depth: 0`); the explicit fetch is the
      # fallback for a revision that is not reachable from a fetched ref.
      - name: Resolve the semver baseline revision
        env:
          SEMVER_BASELINE_REV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          if ! git rev-parse --verify "${SEMVER_BASELINE_REV}^{commit}"; then
            echo "the baseline revision is not in the checkout; fetching it explicitly"
            git fetch --no-tags origin "$SEMVER_BASELINE_REV"
            git rev-parse --verify "${SEMVER_BASELINE_REV}^{commit}"
          fi
      # The same script the local quick gate runs as its `semver-checks`
      # stage. It fails the job when a publishable crate breaks its public
      # API; a missing baseline or a missing tool is the only skippable case.
      - name: Public API semver gate
        env:
          SEMVER_BASELINE_REV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: timeout --kill-after=30s 2700s bash scripts/quality/semver-api-gate.sh

  # Job id `linux` is load-bearing: rust-cache keys by job id, and
  # packaging.yml's `linux` release job restores the dependency cache this
  # job warms on the same commit. Do not rename it.
  linux:
    name: Linux (release build + packaging smoke)
    needs: policy
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # A release build of the gpui workspace overflows the ubuntu-latest
      # runner's free disk. Reclaim ~10GB of pre-installed SDKs this Rust CI
      # never uses before any compilation.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - name: Install Linux GUI system deps and mold
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libxkbcommon-dev mold
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Fetch private shared UI kit dependency
        env:
          SHARED_UI_KIT_READ_KEY: ${{ secrets.SHARED_UI_KIT_READ_KEY }}
        run: bash scripts/quality/shared-ui-git-credentials.sh fetch
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@sccache
      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('RUSTC_WRAPPER', 'sccache');
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # Reuse the local release-shape smoke so a package-layout regression is
      # found before the fallback matrix and the same artifact contract can be
      # exercised before CI is spent.
      - name: Release build and packaging smoke
        env:
          PR_SMOKE_PROFILE: ${{ github.event_name == 'pull_request' }}
        run: timeout --kill-after=30s 3600s scripts/quality/release-smoke.sh
      # Isolate the vendor backend only as a development/fallback matrix. The
      # standard tests above already include it through default hardware-all.
      # ADR-051: the vendor matrix runs against the GPUI product only.
      - run: cargo nextest run --locked -p taskmanager-gpui --lib --features hardware-all,nvidia --profile ci -j 4
