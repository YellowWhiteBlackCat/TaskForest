# Native portability CI.
#
# Windows and macOS are compile/test peers of the Linux CI on every pull
# request and main push. macOS has no packaging or real-device visual evidence
# job here; it proves the target builds and its library contracts compile/run.
name: Portability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *" # monthly, 1st at 04:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cache alignment: rust-cache keys hash all CARGO*/RUST* variables. The env
# below must stay aligned with packaging.yml's workflow env so the Windows
# job here shares one cache line with the Windows packaging job (same job
# id), turning the monthly guard into a cache warmer for releases instead of
# a cold start. CARGO_PROFILE_DEV_DEBUG is shared verbatim by ci.yml and
# packaging.yml for the same reason. ci.yml's RUSTFLAGS additionally carries
# the Linux-only mold link flag — this workflow runs on macOS/Windows runners
# where mold does not exist, so it must NOT copy that flag.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  macos:
    name: macOS (compile + lib tests; no packaging)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # Build the GUI product natively on macOS — the workspace root is the
      # no-binary taskmanager-gates host after ADR-051; the product lives in
      # its own crate and pulls in `macos-blade` (Metal) on this target.
      - run: cargo build --locked -p taskmanager-gpui --bin taskforest-g
      # Only compile libraries relevant to this native target. The Linux and
      # Windows adapters carry target-specific lib tests and are intentionally
      # excluded from the macOS portability lane.
      - run: cargo nextest run --locked --workspace --lib --exclude taskmanager-platform-linux --exclude taskmanager-platform-windows --exclude taskmanager-tray-muda --profile ci -j 4 --no-tests=pass
      # macOS muda menu construction is main-thread-only; nextest deliberately
      # runs tests on worker threads. Keep native tray compilation covered
      # above/below and leave the main-thread UI harness to a dedicated lane.
      - run: cargo check --locked -p taskmanager-tray-muda
      # Second-OS adapter contract proof: the macOS adapter must compose the
      # complete standard product surface and publish honest typed outcomes on
      # its native target (P1-ARCH-09). The same suite also runs on Linux.
      - run: cargo nextest run --locked -p taskmanager-platform-macos --profile ci -j 4
      # Reduced debug builds remain useful for fallback tests; releases reject
      # them and always use the default hardware-all profile.
      - run: cargo check --locked -p taskmanager-gpui --lib --no-default-features
      # Structural lint parity with the Linux clippy job (ci.yml) and the local
      # standard gate (scripts/quality/local-gates.sh): both `-W` lints are
      # allow-by-default (restriction / pedantic), so `-D warnings` alone never
      # activates clippy.toml's 48/650 ratchets. This is the only job where the
      # macOS-only `cfg` modules are compiled, so it is where those ratchets
      # reach the macOS adapter. No mold link flag (see the workflow env note).
      # `--exclude taskmanager-platform-linux` is the same scope boundary this
      # job's nextest runs already use: that crate is structurally Linux-only
      # (its lib re-exports `cfg(target_os = "linux")` items unconditionally),
      # so a native-target workspace clippy cannot compile it. Placed after the
      # native steps so a lint-only failure still leaves the build/test evidence
      # above intact.
      - run: cargo clippy --locked --workspace --exclude taskmanager-platform-linux --all-targets --features test-support -- -D warnings -W clippy::cognitive_complexity -W clippy::too_many_lines

  windows:
    name: Windows (native safety receipt)
    runs-on: windows-latest
    timeout-minutes: 120
    # Windows native boundaries are now a required safety receipt, not an
    # advisory cross-target compile. Product telemetry still contains typed
    # unsupported domains, but every implemented native seam must execute here.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # Build the GUI product natively on Windows (MSVC) — the gpui crate's
      # target-conditional gpui dep pulls in `windows-manifest` additively here.
      - run: cargo build --locked -j 4 -p taskmanager-gpui --bin taskforest-g
      # Run the boundary and adapter's complete native test surface, including
      # the Known Folder, exact-process, WTS, registry and config receipts.
      - name: Execute native boundary receipt
        run: |
          set -o pipefail
          cargo nextest run --locked -p taskmanager-windows-api -p taskmanager-platform-windows --all-targets --profile ci -j 4 2>&1 | tee windows-native-receipt.txt
      - name: Upload native boundary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-receipt
          path: windows-native-receipt.txt
          if-no-files-found: error
      # The workspace lib suite also exercises the shared atomic ConfigStore
      # and its language/font round-trip contract on this real Windows host.
      # The Linux and macOS adapters are excluded: platform-linux's nix/Unix
      # call sites and platform-macos's sysinfo uid handling are single-platform
      # artifacts (the Windows product links platform-windows instead); their
      # boundary-crate edges are target-gated since 2026-08-18.
      - run: cargo nextest run --locked --workspace --lib --exclude taskmanager-platform-linux --exclude taskmanager-platform-macos --profile ci -j 4
      # Every frontend is a separate product crate (ADR-051). The default
      # workspace build covers the GPUI product, so compile the Iced and TUI
      # products explicitly; otherwise a Windows-only dependency or cfg
      # regression can remain invisible while the native GPUI job stays green.
      - name: Check Iced frontend on Windows
        run: cargo check --locked -p taskmanager-iced -j 4
      - name: Check TUI frontend on Windows
        run: cargo check --locked -p taskmanager-tui -j 4
      # Reduced debug builds remain useful for fallback tests; releases reject
      # them and always use the default hardware-all profile.
      - run: cargo check --locked -p taskmanager-gpui --lib --no-default-features -j 4
      # Structural lint parity with the Linux clippy job (ci.yml) and the local
      # standard gate (scripts/quality/local-gates.sh): both `-W` lints are
      # allow-by-default (restriction / pedantic), so `-D warnings` alone never
      # activates clippy.toml's 48/650 ratchets. This is the only job where the
      # Windows-only `cfg` modules (boundary and native adapter) are compiled,
      # so it is where those ratchets reach them. No mold link flag (see the
      # workflow env note). `--exclude taskmanager-platform-linux` is the same
      # scope boundary this job's nextest runs already use: that crate is
      # structurally Linux-only (its lib re-exports `cfg(target_os = "linux")`
      # items unconditionally), so a native-target workspace clippy cannot
      # compile it. Placed after the native steps so a lint-only failure still
      # leaves the receipt and test evidence above intact.
      - run: cargo clippy --locked --workspace --exclude taskmanager-platform-linux --all-targets --features test-support -- -D warnings -W clippy::cognitive_complexity -W clippy::too_many_lines
