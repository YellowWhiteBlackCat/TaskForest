# Reusable artifact builder — the ONLY place release artifacts are produced.
#
# Never triggered directly (zero cost at rest): release.yml (v* tag push) and
# rehearsal.yml (manual, non-publishing rehearsal) are thin wrappers that call
# this workflow. One expensive action, one trigger source — a wrapper can never
# spend packaging minutes by accident.
#
# Surface matrix:
#   Linux   native amd64 + arm64: DEB and RPM.
#   Windows native x64 + arm64: MSI.
#   macOS   deferred until its signing and notarization contract is ready.
#
# Linux arm64 uses the public GitHub-hosted ARM runner so the binaries and
# package metadata are produced natively. Windows arm64 likewise uses the
# native Windows ARM runner; no emulation or mislabeled x64 payload is allowed.
# Every Linux package format replays the PKGBUILD layout authority through
# packaging/linux/stage-release-tree.sh, so Arch/deb/rpm installs identical
# trees by construction. Only the GPUI frontend shape is packaged.
#
# Token policy is owned by the CALLER: this workflow declares no `permissions`
# block, because a called workflow can only restrict the caller's GITHUB_TOKEN.
# release.yml grants contents:write on its calling job; rehearsal.yml grants
# contents:read and never reaches the publish job because publish=false.

# Windows is part of the release artifact contract. Rehearsal may still opt out
# for a deliberately Linux-only local check, but a published release always
# waits for both native MSI jobs and all Linux architecture jobs.
name: Packaging

on:
  workflow_call:
    inputs:
      publish:
        description: Attach artifacts to the GitHub Release for the triggering tag
        type: boolean
        default: false
      linux:
        description: Build the Linux artifact set
        type: boolean
        default: true
      windows:
        description: Build the Windows MSI set
        type: boolean
        default: true
      version:
        description: Package version (defaults to the Cargo.toml version)
        type: string
        default: ""
      ref:
        description: Git ref to build (defaults to the event's checkout ref)
        type: string
        default: ""
      release_tag:
        description: Tag the GitHub Release attaches to when publishing (defaults to the event ref)
        type: string
        default: ""
      prerelease:
        description: Mark the published GitHub Release as a prerelease
        type: boolean
        default: false
    secrets:
      WINDOWS_CERT_B64:
        description: Optional base64-encoded Authenticode PFX certificate
        required: false
      WINDOWS_CERT_PASSWORD:
        description: Optional password for WINDOWS_CERT_B64
        required: false

# Cache alignment: rust-cache keys hash all CARGO*/RUST* variables, so any
# divergence from ci.yml/portability.yml splits the shared cache lines and
# the release jobs cold-build the dependencies CI just compiled on the same
# commit. The base env below is shared verbatim by ci.yml and portability.yml
# (CARGO_PROFILE_DEV_DEBUG included). The Linux job additionally overrides
# RUSTFLAGS with the byte-identical mold link flag from ci.yml's workflow
# env, keeping the `linux` job-id cache line shared with CI's release-smoke
# job; the Windows jobs keep the plain `-D warnings` flag, matching
# portability.yml's Windows job (same job id, shared cache). RUSTFLAGS also
# keeps release artifacts warning-clean exactly like the blocking gate.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    name: Build Linux ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    if: inputs.linux
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    env:
      DEB_ARCH: ${{ matrix.deb_arch }}
      RPM_ARCH: ${{ matrix.rpm_arch }}
      # Byte-identical to ci.yml's workflow-level RUSTFLAGS so this job keeps
      # sharing the `linux` job-id rust-cache line with CI's release-smoke
      # job. mold is a link-time-only ELF accelerator; the produced binaries
      # are unchanged apart from being linked faster.
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      # An empty `ref` input falls back to the event's natural ref (tag push
      # → the tag commit; rehearsal → the dispatch branch head).
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - name: Install build and packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev rpm file mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # Native runner builds: the host target is the package target, so a
      # successful arm64 job cannot accidentally contain an x86_64 binary.
      - name: Build release binaries
        run: |
          cargo build --locked --release -j 4 \
            -p taskmanager-gpui \
            -p taskmanager-setup-helper \
            -p taskmanager-privilege-helper \
            -p taskmanager-net-launcher \
            -p taskmanager-process-control-helper \
            -p taskmanager-smbios-helper \
            -p taskmanager-rapl-helper \
            -p taskmanager-msr-helper
      - name: Resolve package version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Stage the release tree (PKGBUILD layout authority)
        run: packaging/linux/stage-release-tree.sh staging
      - name: Build DEB
        run: |
          packaging/debian/build-deb.sh staging \
            "${{ steps.version.outputs.version }}" \
            "TaskForest-G-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb" \
            "$DEB_ARCH"
      - name: Build RPM
        run: |
          packaging/rpm/build-rpm.sh staging \
            "${{ steps.version.outputs.version }}" \
            "TaskForest-G-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm"
      - name: Validate DEB package
        run: |
          set -euo pipefail
          deb=$(find . -maxdepth 1 -type f -name "TaskForest-G-*-${{ matrix.arch }}.deb" -print -quit)
          test -n "$deb"
          test "$(dpkg-deb --field "$deb" Architecture)" = "$DEB_ARCH"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" > "deb-contents-${DEB_ARCH}.txt"
          test -s "deb-contents-${DEB_ARCH}.txt"
      - name: Validate RPM package
        run: |
          set -euo pipefail
          rpm_file=$(find . -maxdepth 1 -type f -name "TaskForest-G-*-${{ matrix.arch }}.rpm" -print -quit)
          test -n "$rpm_file"
          test "$(rpm -qp --queryformat '%{ARCH}\n' "$rpm_file")" = "$RPM_ARCH"
          rpm -qp --info "$rpm_file"
          rpm -qp --list "$rpm_file" > "rpm-contents-${RPM_ARCH}.txt"
          rpm -qp --requires "$rpm_file" > "rpm-requires-${RPM_ARCH}.txt"
          test -s "rpm-contents-${RPM_ARCH}.txt"
      - name: Emit sha256 checksums
        run: |
          set -euo pipefail
          files=(
            "$(find . -maxdepth 1 -type f -name "TaskForest-G-*-${{ matrix.arch }}.deb" -print -quit)"
            "$(find . -maxdepth 1 -type f -name "TaskForest-G-*-${{ matrix.arch }}.rpm" -print -quit)"
          )
          for file in "${files[@]}"; do test -n "$file" && test -f "$file"; done
          sha256sum "${files[@]}" > "checksums-sha256-linux-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-artifacts
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.publish && 90 || 3 }}
          path: |
            TaskForest-G-*-${{ matrix.arch }}.deb
            TaskForest-G-*-${{ matrix.arch }}.rpm
            checksums-sha256-linux-${{ matrix.arch }}.txt

  windows:
    name: Build Windows ${{ matrix.arch }} MSI
    runs-on: ${{ matrix.runner }}
    if: inputs.windows
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            msi_arch: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            rust_target: aarch64-pc-windows-msvc
            msi_arch: arm64
    env:
      WINDOWS_CERT_B64: ${{ secrets.WINDOWS_CERT_B64 }}
      RUST_TARGET: ${{ matrix.rust_target }}
      MSI_ARCH: ${{ matrix.msi_arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust target
        shell: bash
        run: rustup target add "$RUST_TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # GPUI product only — the release surface deliberately skips the Iced
      # build. The fixed UAC process-control helper is built for the same
      # native target and installed beside the app so the runas path can find
      # the exact helper it names.
      - name: Build release exe
        shell: bash
        run: |
          cargo build --locked --release --target "$RUST_TARGET" -j 4 \
            -p taskmanager-gpui -p taskmanager-process-control-helper
          mkdir -p msi-stage
          install -m755 "target/$RUST_TARGET/release/taskforest-g.exe" msi-stage/taskforest-g.exe
          install -m755 \
            "target/$RUST_TARGET/release/taskmanager-process-control-helper.exe" \
            msi-stage/taskmanager-process-control-helper.exe
          install -m644 LICENSE msi-stage/
      # WiX v4+ ships the standard dialog sets (WixUI_InstallDir et al.) as an
      # optional extension; without it `wix build -ext WixToolset.UI.wixext`
      # fails with WIX0144 (seen on the rc.2 tag run 33060554020). Keep the
      # tool and extension on the same exact version so a future WiX release
      # cannot silently change the release installer. WiX v7 additionally
      # gates EVERY command behind the OSMF EULA acknowledgement (WIX7015,
      # seen on rehearsal run 33065976879); `eula accept` writes the per-user
      # sentinel so build/decompile keep working even with their own
      # -acceptEula flags removed later.
      - name: Install WiX
        shell: bash
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          wix extension add --global WixToolset.UI.wixext/7.0.0
          wix extension list --global
      # MSI ProductVersion is numeric x.y.z: strip any prerelease suffix for the
      # ProductVersion property, but keep the FULL Cargo version in `full` so
      # the release FILE NAME matches the unified
      # TaskForest-<UI>-<version>-<platform> convention (rc suffix included).
      # The package architecture is explicit so arm64 cannot receive an x64 MSI.
      - name: Resolve numeric MSI version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          fi
          numeric=$(printf '%s' "$version" | sed 's/-[^-]*$//')
          echo "version=$numeric" >>"$GITHUB_OUTPUT"
          echo "full=$version" >>"$GITHUB_OUTPUT"
      - name: Build MSI
        shell: bash
        run: |
          packaging/windows/build-msi.sh msi-stage \
            "${{ steps.version.outputs.version }}" \
            "$MSI_ARCH" \
            "TaskForest-G-${{ steps.version.outputs.full }}-${{ matrix.arch }}.msi" \
            "${{ steps.version.outputs.full }}"
      - name: Validate MSI database and payload references
        shell: bash
        run: |
          set -euo pipefail
          msi=$(find . -maxdepth 1 -type f -name "TaskForest-G-*-${{ matrix.arch }}.msi" -print -quit)
          test -n "$msi"
          test -s "$msi"
          rm -rf msi-decompile
          mkdir -p msi-decompile
          wix msi decompile -acceptEula wix7 \
            -o msi-decompile/taskforest.wxs "$msi"
          test -s msi-decompile/taskforest.wxs
          grep -Eiq 'taskforest-g\.exe' msi-decompile/taskforest.wxs
          grep -Eiq 'taskmanager-process-control-helper\.exe' msi-decompile/taskforest.wxs
          grep -Eiq 'license' msi-decompile/taskforest.wxs
          # The full Cargo version (rcN included) must ride inside the package,
          # not just in the file name.
          grep -Fq '${{ steps.version.outputs.full }}' msi-decompile/taskforest.wxs
      # Sign ONLY when an Authenticode PFX cert secret exists; until then the
      # MSI ships unsigned (SmartScreen will warn) per the owner decision.
      - name: signtool (when WINDOWS_CERT_B64 secret present)
        if: env.WINDOWS_CERT_B64 != ''
        shell: bash
        run: |
          echo "${{ secrets.WINDOWS_CERT_B64 }}" | base64 -d > cert.pfx
          signtool sign /fd sha256 /td sha256 \
            /tr https://time.certum.pl \
            /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" \
            msi-stage/taskmanager-process-control-helper.exe \
            "TaskForest-G-${{ steps.version.outputs.full }}-${{ matrix.arch }}.msi"
          rm -f cert.pfx
      - name: Emit sha256 checksums
        shell: bash
        # MSYS sha256sum marks output as binary mode (`hash *name`); normalize
        # to GNU text format so every platform's manifest has one shape.
        run: sha256sum "TaskForest-G-${{ steps.version.outputs.full }}-${{ matrix.arch }}.msi" | sed 's/ \*/  /' > checksums-sha256-windows-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-artifacts
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.publish && 90 || 3 }}
          path: |
            TaskForest-G-*-${{ matrix.arch }}.msi
            checksums-sha256-windows-${{ matrix.arch }}.txt

  publish:
    name: Publish release artifacts
    if: inputs.publish
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all validated artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          path: release-artifacts
          merge-multiple: true
      - name: Verify release artifact matrix
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          deb_amd64=$(find . -maxdepth 1 -type f -name 'TaskForest-G-*-x64.deb' -print -quit)
          deb_arm64=$(find . -maxdepth 1 -type f -name 'TaskForest-G-*-arm64.deb' -print -quit)
          rpm_x86_64=$(find . -maxdepth 1 -type f -name 'TaskForest-G-*-x64.rpm' -print -quit)
          rpm_aarch64=$(find . -maxdepth 1 -type f -name 'TaskForest-G-*-arm64.rpm' -print -quit)
          msi_x64=$(find . -maxdepth 1 -type f -name 'TaskForest-G-*-x64.msi' -print -quit)
          msi_arm64=$(find . -maxdepth 1 -type f -name 'TaskForest-G-*-arm64.msi' -print -quit)
          for package in "$deb_amd64" "$deb_arm64" "$rpm_x86_64" "$rpm_aarch64" "$msi_x64" "$msi_arm64"; do
            test -n "$package"
            test -s "$package"
          done

          check_checksum_manifest() {
            local manifest=$1
            shift
            local expected actual
            test -s "$manifest"
            expected=$(printf '%s\n' "$@" | sort)
            actual=$(awk '{print $2}' "$manifest" | sed -e 's#^\./##' -e 's#^\*##' | sort)
            if [[ "$actual" != "$expected" ]]; then
              echo "checksum manifest '$manifest' does not cover exactly its artifact set" >&2
              printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
              return 1
            fi
            sha256sum --check --strict "$manifest"
          }

          check_checksum_manifest checksums-sha256-linux-x64.txt \
            "$(basename "$deb_amd64")" "$(basename "$rpm_x86_64")"
          check_checksum_manifest checksums-sha256-linux-arm64.txt \
            "$(basename "$deb_arm64")" "$(basename "$rpm_aarch64")"
          check_checksum_manifest checksums-sha256-windows-x64.txt \
            "$(basename "$msi_x64")"
          check_checksum_manifest checksums-sha256-windows-arm64.txt \
            "$(basename "$msi_arm64")"
      - name: Attach validated artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/TaskForest-G-*-x64.deb
            release-artifacts/TaskForest-G-*-arm64.deb
            release-artifacts/TaskForest-G-*-x64.rpm
            release-artifacts/TaskForest-G-*-arm64.rpm
            release-artifacts/TaskForest-G-*-x64.msi
            release-artifacts/TaskForest-G-*-arm64.msi
            release-artifacts/checksums-sha256-*.txt
